plugins {
	id 'java'
	id 'org.jetbrains.kotlin.jvm' version '1.9.23'
	id 'org.jetbrains.kotlin.plugin.spring' version '1.9.23'
	id("org.jetbrains.kotlin.plugin.jpa") version "2.2.21"
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jetbrains.kotlin.kapt' version "2.3.0"
}

group = 'com.libraryapp'
version = '0.0.1-SNAPSHOT'
description = 'library app with kotlin'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'

	// Querydsl (SpringBoot 3.x용 설정)
	implementation("com.querydsl:querydsl-jpa:5.0.0:jakarta") // :jakarta 추가
	kapt("com.querydsl:querydsl-apt:5.0.0:jakarta")           // :jakarta 추가

	// 추가로 필요한 jakarta annotation (오류 방지)
	implementation "jakarta.annotation:jakarta.annotation-api"
	implementation "jakarta.persistence:jakarta.persistence-api"

	runtimeOnly 'com.h2database:h2'

	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs += ["-javaagent:${classpath.find { it.name.contains("byte-buddy-agent") }.absolutePath}"]
}
