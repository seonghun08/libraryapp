plugins {
	id 'java'
	id 'org.jetbrains.kotlin.jvm' version '1.9.23' // Kotlin plugin
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.libraryapp'
version = '0.0.1-SNAPSHOT'
description = 'library app with kotlin'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	implementation 'org.jetbrains.kotlin:kotlin-reflect' // Kotlin reflection
	implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8' // Kotlin 표준 라이브러리

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
